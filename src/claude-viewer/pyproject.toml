[project]
name = "claude-viewer"
version = "0.1.0"
description = "View Claude Code session transcripts in the terminal"
requires-python = ">=3.12"
dependencies = ["rich>=13", "textual>=8"]

[project.scripts]
claude-viewer = "claude_viewer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_viewer"]
